[package]
name = "mediavault-desktop"
version = "0.1.0"
description = "MediaVault Desktop — Single-user local video, audio, and photo downloader"
license = "MIT"
edition = "2021"

[lib]
name = "mediavault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
dirs = "5"
rfd = "0.15"
thiserror = "2"
once_cell = "1"
sha2 = "0.10"

[profile.release]
strip = true
