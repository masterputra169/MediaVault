[package]
name = "mediavault"
version = "0.5.0"
description = "MediaVault — 100% Pure-Rust Local Video, Audio, and Photo Downloader"
license = "MIT"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
rfd = "0.15"
once_cell = "1"
base64 = "0.22"
arboard = "3.4"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
hound = "3.5"
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4", "symphonia-mp3", "symphonia-wav"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
