name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  desktop-rust:
    name: Desktop (Rust & UI)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check desktop UI syntax
        run: node --check rust-desktop/ui/app.js

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-desktop/src-tauri

      - name: Run Rust desktop unit tests
        working-directory: rust-desktop/src-tauri
        run: cargo test --locked
