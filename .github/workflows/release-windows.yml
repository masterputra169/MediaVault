name: Release Windows Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

jobs:
  build-windows:
    name: Build Windows Installer & Portable EXE
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: rust-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-desktop/src-tauri

      - name: Install pinned Tauri CLI
        working-directory: rust-desktop
        run: pnpm install --frozen-lockfile

      - name: Verify desktop UI syntax & Rust unit tests
        shell: pwsh
        run: |
          node --check rust-desktop/ui/app.js
          Set-Location rust-desktop/src-tauri
          cargo test --locked

      - name: Build Tauri v2 NSIS Installer
        working-directory: rust-desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis -- --locked

      - name: Prepare release artifacts & SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "rust-desktop\src-tauri\target\release\mediavault-desktop.exe" "release-assets\MediaVault.exe"
          Copy-Item "rust-desktop\src-tauri\target\release\bundle\nsis\MediaVault_*_x64-setup.exe" "release-assets\"
          $hashes = Get-ChildItem "release-assets\*" -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          $hashes | Out-File -Encoding ascii "release-assets\SHA256SUMS.txt"
          Get-ChildItem "release-assets"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mediavault-windows-x64
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mediavault-windows-x64
          path: release-assets

      - name: Publish GitHub Release (on tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release-assets/*
