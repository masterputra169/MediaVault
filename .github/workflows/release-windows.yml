name: Release Windows Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

jobs:
  build-windows:
    name: Build 100% Pure-Rust Windows Installer & Portable EXE
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-desktop

      - name: Run Rust unit tests
        working-directory: rust-desktop
        run: cargo test --locked

      - name: Build release binary (100% Pure Rust)
        working-directory: rust-desktop
        run: cargo build --release --locked

      - name: Build Windows NSIS Installer
        shell: pwsh
        working-directory: rust-desktop
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release artifacts & SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "rust-desktop\target\release\mediavault.exe" "release-assets\MediaVault.exe"
          Copy-Item "rust-desktop\target\release\MediaVault_*_x64-setup.exe" "release-assets\"
          $hashes = Get-ChildItem "release-assets\*" -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          $hashes | Out-File -Encoding ascii "release-assets\SHA256SUMS.txt"
          Get-ChildItem "release-assets"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mediavault-windows-x64
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mediavault-windows-x64
          path: release-assets

      - name: Publish GitHub Release (on tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release-assets/*
