name: Release Windows Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

jobs:
  build-windows:
    name: Build Windows Installer & Portable EXE
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: rust-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-desktop/src-tauri

      - name: Install pinned Tauri CLI
        working-directory: rust-desktop
        run: pnpm install --frozen-lockfile

      - name: Verify desktop UI syntax & Rust unit tests
        shell: pwsh
        run: |
          node --check rust-desktop/ui/app.js
          Set-Location rust-desktop/src-tauri
          cargo test --locked

      - name: Build Tauri v2 NSIS Installer
        working-directory: rust-desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis -- --locked

      - name: Prepare release artifacts & SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "rust-desktop\src-tauri\target\release\mediavault-desktop.exe" "release-assets\MediaVault.exe"
          Copy-Item "rust-desktop\src-tauri\target\release\bundle\nsis\MediaVault_*_x64-setup.exe" "release-assets\"
          $hashes = Get-ChildItem "release-assets\*" -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          $hashes | Out-File -Encoding ascii "release-assets\SHA256SUMS.txt"
          Get-ChildItem "release-assets"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediavault-windows-x64
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediavault-windows-x64
          path: release-assets

      - name: Publish GitHub Release (on tag push)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: release-assets/*
